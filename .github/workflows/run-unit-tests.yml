name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run Unit Tests
        # native_asan MUSI byt v seznamu. Bounds guardy v Packet::readFrom
        # zamerne nemeni navratovou hodnotu (odmitnou presne to, co upstream
        # odmitne az po precteni), takze pod `native` projdou i BEZ nich -- rika
        # to i hlavicka test_packet_readfrom.cpp. Bez tohohle envu slo ty ctyri
        # kontroly z Packet.cpp odstranit a CI zustalo zelene.
        run: pio test -e native -e native_asan -e native_kiss_modem -vv

      - name: Upload Test Results
        # Upload test results even if the test step failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pio/build/native/
